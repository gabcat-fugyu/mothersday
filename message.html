  <title>ありがとう</title>
</head>

<body>

  <div class="container">

    <div class="card">
      <p>
        いつもありがとう！ <br>
        毎日当たり前みたいに助けてもらってるけど、ほんと感謝してます。<br>
        体に気をつけて、これからも元気でいてね。<br>
        母の日おめでとう！<br>
        快星より
      </p>
    </div>

    <div class="card">
      <p>いつもご飯とか洗濯とかやってくれてありがとう<br>
        文句ばっか言ってるけど感謝してます<br>
        今年は受験で文句が増えるかもしれないけど感謝の気持ちは忘れません<br>
        怜依より</p>
    </div>

    <div class="card">
      <p>お母さんへ<br>
        いつもはこんな事言えないけど<br>
        いつも世話してくれてありがとう<br>
        これからもよろしくね<br>
        大好きです<br>
        あさひより</p>
    </div>

        <button>前のページに戻る</button>

    </div>
